  ai_genre: "Ecliptica — гэта сімулятар выжывання калоніі з адкрытым светам, які аб'ядноўвае кіраванне лагістыкай і даследаванне варожага асяроддзя."
  faq_title: "Цэнтр Дадзеных (FAQ)"
  faq_q1: "Што гэта за гульня?"
  faq_a1: "Ecliptica — гэта сімулятар выжывання калоніі ад першай асобы. Асноўны ўпор зроблены на здабычу рэсурсаў, аўтаматызацыю лагістыкі і стварэнне аўтаномнай інфраструктуры ў варожым свеце."
  faq_q2: "На якія гульні падобная Ecliptica?"
  faq_a2: "Ecliptica аб'ядноўвае аўтаматызацыю з Factorio, кіраванне калоніяй з Rimworld і дух даследавання No Man's Sky. Пры гэтым наша эканамічная мадэль натхнёная глыбокімі дынамічнымі рынкамі серыі X4 Foundations."
  faq_q3: "Ці ёсць у гульні дынамічная эканоміка?"
  faq_a3: "Так. Унутраная эканоміка працуе на лагічным алгарытме, які разлічвае кошт рэсурсаў на аснове іх дэфіцыту, попыту і складанасці лагістычнага ланцужка."
  faq_q4: "Ці будуць у гульні квэсты?"
  faq_a4: "Так. Вас чакаюць буйныя сюжэтныя галінкі, лакальныя пабочныя заданні, а таксама працэдурна генераваныя місіі, якія залежаць ад стану свету."
  faq_q5: "Ці можна змяняць ландшафт?"
  faq_a5: "Так, ландшафт цалкам дэфармуецца на ўсю шырыню свету. Вы можаце пераўтвараць паверхню пад свае патрэбы або літаральна ўзрываць цэлыя горныя хрыбты."
  faq_q6: "Ці можна аўтаматызаваць здабычу рэсурсаў?"
  faq_a6: "Так. Аўтаматызацыя — адна з асноў гульні. Кожную вытворчасць можна ператварыць у цалкам аўтаномную інфраструктуру."
  faq_q7: "Ці будуць у гульні глабальныя канфлікты?"
  faq_a7: "Так. Усе ўдзельнікі сімуляцыі могуць аб'ядноўвацца ў велізарныя фракцыі з уласным бачаннем будучыні планеты і канкуруючымі інтарэсамі."
  faq_q8: "Ці ёсць сэнс у даследаванні свету?"
  faq_a8: "Безумоўна. Наш працэдурна генераваны свет спецыяльна праектаваўся так, каб заахвочваць цікаўнасць і адкрываць унікальныя геалагічныя сакрэты."
  faq_q9: "Ці будзе ў гульні мультыплэер?"
  faq_a9: "Так, але ён будзе рэалізаваны пасля выхаду гульні ў ранні доступ."
  faq_q10: "Ці можна паспрабаваць гульню бясплатна?"
  faq_a10: "Так. Хутка з'явіцца публічная дэма-версія, якая дазволіць ацаніць асноўныя механікі і захавае практычна ўвесь арыгінальны кантэнт."
  faq_q11: "На якім рухавічку распрацавана гульня?"
  faq_a11: "Мы выкарыстоўваем уласны рухавічок, створаны на базе Qt Quick 3D для дасягнення максімальнай прадукцыйнасці сімуляцыі."
  faq_q12: "Наколькі велізарны гульнявы свет?"
  faq_a12: "Свет бясконцы. Адзіным абмежаваннем з'яўляецца мяжа дакладнасці вылічэння лікаў."
  faq_q13: "Якая далёкасць прамалёўкі?"
  faq_a13: "Адна з самых вялікіх на рынку — мы падтрымліваем бачнасць на 10-14 кіламетраў у любы бок (амаль 30 км у дыяметры) без сур'ёзных праблем з прадукцыйнасцю."
  faq_q14: "Якія платформы вы падтрымліваеце?"
  faq_a14: "Ecliptica афіцыйна падтрымлівае Linux (Ubuntu), Steam Deck і Windows."

