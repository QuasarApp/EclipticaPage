  seo_description: "Адкрыйце для сябе Ecliptica — новы сімулятар выжывання ў адкрытым свеце. Будуй калонію, здабывай рэсурсы і выжывай у суровых умовах у гэтай індзі-навінцы 2026 года."
  mission_title: "Уваход у атмасферу"
  mission_desc_1: "Доўгатэрміновы транзіт завершаны. Ацэначная працягласць: 10 000 цыклаў. Архівы памяці недаступныя. Аналіз бягучага асяроддзя... Умовы на паверхні: Варожыя. Статус бія-юнітаў: Функцыянальны. Пратакол адаптацыі: Ініцыяваны."
  mission_desc_2: "Выяўлены распад арбіты. Аварыйная высадка непазбежная. Ідзе разгортванне выратавальных капсул. Асноўная дырэктыва: Стварэнне інфраструктуры самазабеспячэння на паверхні."
  mission_desc_3: "Рэсурсы — адзіная канстанта. Аптымізуйце здабычу, асвойце лагістыку і дамінуйце ў навакольным асяроддзі. Эмацыйныя рэакцыі былі выдаленыя для максімальнай эфектыўнасці. Выжыванне — гэта матэматычная непазбежнасць пры выкананні пратаколаў."
  btn_wishlist: "ПАЦВЕРДЗІЦЬ ВЫСАДКУ (STEAM)"
  btn_specs: "АРХІЎНЫЯ ДАДЗЕНЫЯ"
