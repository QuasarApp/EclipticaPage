  ai_genre: "Ecliptica è un simulatore di sopravvivenza di colonia open-world che unisce la gestione della logistica e l'esplorazione di un ambiente ostile."
  faq_title: "Centro Dati (FAQ)"
  faq_q1: "Che tipo di gioco è Ecliptica?"
  faq_a1: "Ecliptica è un simulatore di sopravvivenza di una colonia in prima persona. L'obiettivo principale è l'estrazione di risorse, l'automazione della logistica e la creazione di un'infrastruttura autonoma in un mondo ostile."
  faq_q2: "A quali giochi è simile Ecliptica?"
  faq_a2: "Ecliptica combina l'automazione di Factorio, la gestione della colonia di Rimworld e lo spirito esplorativo di No Man's Sky. Allo stesso tempo, il nostro modello economico è ispirato ai profondi mercati dinamici della serie X4 Foundations."
  faq_q3: "C'è un'economia dinamica nel gioco?"
  faq_a3: "Sì. L'economia interna si basa su un algoritmo logico che calcola il valore delle risorse in base alla loro scarsità, alla domanda e alla complessità della catena logistica."
  faq_q4: "Ci saranno missioni nel gioco?"
  faq_a4: "Sì. Ti aspettano grandi archi narrativi, missioni secondarie locali e missioni generate proceduralmente che dipendono dallo stato del mondo."
  faq_q5: "Il terreno può essere modificato?"
  faq_a5: "Sì, il terreno si deforma completamente per tutta la larghezza del mondo. Puoi trasformare la superficie secondo le tue esigenze o letteralmente far saltare in aria intere catene montuose."
  faq_q6: "Posso automatizzare l'estrazione di risorse?"
  faq_a6: "Sì. L'automazione è una delle basi del gioco. Ogni produzione può essere trasformata in un'infrastruttura completamente autonoma."
  faq_q7: "Ci saranno conflitti globali nel gioco?"
  faq_a7: "Sì. Tutti i partecipanti alla simulazione possono unirsi in enormi fazioni con la propria visione del futuro del pianeta e interessi in competizione."
  faq_q8: "C'è un senso nell'esplorare il mondo?"
  faq_a8: "Assolutamente. Il nostro mondo generato proceduralmente è stato appositamente progettato per incoraggiare la curiosità e svelare segreti geologici unici."
  faq_q9: "Ci sarà il multiplayer nel gioco?"
  faq_a9: "Sì, ma sarà implementato dopo il rilascio del gioco in accesso anticipato."
  faq_q10: "È possibile provare il gioco gratuitamente?"
  faq_a10: "Sì. Presto sarà disponibile una demo pubblica che permetterà di valutare le meccaniche di base e manterrà quasi tutti i contenuti originali."
  faq_q11: "Con quale motore di gioco è sviluppato il gioco?"
  faq_a11: "Utilizziamo il nostro motore proprietario, creato sulla base di Qt Quick 3D, per ottenere le massime prestazioni di simulazione."
  faq_q12: "Quanto è enorme il mondo di gioco?"
  faq_a12: "Il mondo è infinito. L'unico limite è la precisione del calcolo dei numeri."
  faq_q13: "Qual è la distanza di visualizzazione?"
  faq_a13: "Una delle più grandi sul mercato — supportiamo una visibilità di 10-14 chilometri in qualsiasi direzione (quasi 30 km di diametro) senza gravi problemi di prestazioni."
  faq_q14: "Quali piattaforme supportate?"
  faq_a14: "Ecliptica supporta ufficialmente Linux (Ubuntu), Steam Deck e Windows."

  seo_title: "Ecliptica | Nuovo simulatore di sopravvivenza e colonia open-world"
  seo_description: "Scopri Ecliptica, un nuovo simulatore di sopravvivenza in un mondo aperto. Costruisci una colonia, estrai risorse e sopravvivi in condizioni ostili in questo nuovo titolo indie del 2026."
  mission_title: "Ingresso nell'atmosfera"
  mission_desc_1: "Transito a lungo termine completato. Durata stimata: 10.000 cicli. Archivi di memoria inaccessibili. Analisi dell'ambiente attuale... Condizioni superficiali: Ostili. Stato delle unità biologiche: Funzionale. Protocollo di adattamento: Iniziato."
  mission_desc_2: "Decadimento orbitale rilevato. Atterraggio di emergenza inevitabile. Spiegamento delle capsule di salvataggio in corso. Direttiva principale: Creazione di un'infrastruttura di autosostentamento sulla superficie."
  mission_desc_3: "Le risorse sono l'unica costante. Ottimizza l'estrazione, padroneggia la logistica e domina l'ambiente. Le reazioni emotive sono state rimosse per la massima efficienza. La sopravvivenza è una necessità matematica se si seguono i protocolli."
  btn_wishlist: "CONFERMA ATTERRAGGIO (STEAM)"
  btn_specs: "DATI DI ARCHIVIO"
  btn_trailer: "GUARDA IL TRAILER"
  features_title: "Protocolli Operativi"
  feature_1_title: "Interfaccia Logica"
  feature_1_desc: "Controlla gli indicatori attraverso un HUD altamente efficiente. Gestisci le necessità biologiche con precisione matematica."
  feature_2_title: "Geometria Locale"
  feature_2_desc: "Analizza la topografia generata proceduralmente. Identifica gli accumuli di risorse e spostati in zone ad alto rischio per ottenere un vantaggio."
  feature_3_title: "Algoritmo Economico"
  feature_3_desc: "I sistemi commerciali funzionano su logica pura. Offerta, domanda e scarsità dettano il valore di tutti i materiali estratti."
  feature_4_title: "Unità Aziendali"
  feature_4_desc: "Calcola il vantaggio di creare o unirti a strutture aziendali per ottimizzare il flusso delle risorse e la sicurezza."
  visuals_title: "Registri Dati Superficie"
  trailer_title: "Rapporto Visivo (Trailer)"
  comms_title: "Ritrasmissione Segnale"
  footer: "Conferma Protocollo"
  footer_desc: "Transito completato. Richiesto insediamento permanente. Fissa le coordinate di schieramento prima della perdita dell'integrità strutturale."

es:
  header_boot: "[ REINICIO DE SISTEMAS... OBJETIVO ALCANZADO ]"
  nav_about: "Sobre el juego"
  nav_features: "Características"
  nav_visuals: "Visuales"
  nav_faq: "FAQ"
  nav_wishlist_btn: "Añadir a la lista"

  ai_genre: "Ecliptica es un simulador de supervivencia de colonias de mundo abierto que combina la gestión logística y la exploración de un entorno hostil."
  faq_title: "Centro de Datos (FAQ)"
  faq_q1: "¿Qué clase de juego es?"
  faq_a1: "Ecliptica es un simulador de supervivencia de colonias en primera persona. El enfoque principal está en la extracción de recursos, la automatización logística y la creación de una infraestructura autónoma en un mundo hostil."
  faq_q2: "¿A qué juegos se parece Ecliptica?"
  faq_a2: "Ecliptica combina la automatización de Factorio, la gestión de colonias de Rimworld y el espíritu de exploración de No Man's Sky. Al mismo tiempo, nuestro modelo económico está inspirado en los profundos mercados dinámicos de la serie X4 Foundations."
  faq_q3: "¿Hay una economía dinámica en el juego?"
  faq_a3: "Sí. La economía interna funciona mediante un algoritmo lógico que calcula el valor de los recursos en función de su escasez, demanda y la complejidad de la cadena logística."
  faq_q4: "¿Habrá misiones en el juego?"
  faq_a4: "Sí. Te esperan grandes ramas argumentales, misiones secundarias locales, así como misiones generadas procedimentalmente que dependen del estado del mundo."
  faq_q5: "¿Se puede alterar el terreno?"
  faq_a5: "Sí, el terreno se deforma por completo a lo largo y ancho del mundo. Puedes transformar la superficie según tus necesidades o, literalmente, volar cadenas montañosas enteras."
  faq_q6: "¿Se puede automatizar la extracción de recursos?"
  faq_a6: "Sí. La automatización es uno de los fundamentos del juego. Cada producción puede convertirse en una infraestructura totalmente autónoma."
  faq_q7: "¿Habrá conflictos globales en el juego?"
  faq_a7: "Sí. Todos los participantes de la simulación pueden unirse en enormes facciones con su propia visión del futuro del planeta y con intereses competitivos."
  faq_q8: "¿Tiene sentido explorar el mundo?"
  faq_a8: "Definitivamente. Nuestro mundo generado procedimentalmente fue diseñado específicamente para fomentar la curiosidad y revelar secretos geológicos únicos."
  faq_q9: "¿Habrá modo multijugador en el juego?"
  faq_a9: "Sí, pero se implementará después del lanzamiento del juego en acceso anticipado."
  faq_q10: "¿Se puede probar el juego de forma gratuita?"
  faq_a10: "Sí. Pronto estará disponible una demo pública que permitirá evaluar las mecánicas básicas y conservará casi todo el contenido original."
  faq_q11: "¿Con qué motor de juego se ha desarrollado?"
  faq_a11: "Utilizamos nuestro propio motor creado en base a Qt Quick 3D para lograr el máximo rendimiento de la simulación."
  faq_q12: "¿Qué tan inmenso es el mundo de juego?"
  faq_a12: "El mundo es infinito. La única limitación es el límite de precisión del cálculo numérico."
  faq_q13: "¿Cuál es la distancia de dibujado?"
  faq_a13: "Una de las más grandes del mercado — admitimos una visibilidad de 10 a 14 kilómetros en cualquier dirección (casi 30 km de diámetro) sin graves problemas de rendimiento."
  faq_q14: "¿Qué plataformas soportan?"
  faq_a14: "Ecliptica soporta oficialmente Linux (Ubuntu), Steam Deck y Windows."

  seo_title: "Ecliptica | Nuevo simulador de supervivencia y colonias de mundo abierto"
  seo_description: "Descubre Ecliptica, un nuevo simulador de supervivencia en un mundo abierto. Construye tu colonia, extrae recursos y sobrevive en duras condiciones en este nuevo indie de 2026."
  mission_title: "Entrada en la atmósfera"
  mission_desc_1: "Tránsito de larga duración completado. Duración estimada: 10.000 ciclos. Archivos de memoria inaccesibles. Análisis del entorno actual... Condiciones en superficie: Hostiles. Estado de las unidades biológicas: Funcional. Protocolo de adaptación: Iniciado."
  mission_desc_2: "Detectada desintegración orbital. Aterrizaje de emergencia inevitable. Despliegue de cápsulas de supervivencia en curso. Directiva principal: Creación de infraestructura autosuficiente en la superficie."
  mission_desc_3: "Los recursos son la única constante. Optimiza la extracción, domina la logística y controla el entorno. Las reacciones emocionales han sido eliminadas para lograr la máxima eficiencia. La supervivencia es una certeza matemática si se cumplen los protocolos."
  btn_wishlist: "CONFIRMAR ATERRIZAJE (STEAM)"
