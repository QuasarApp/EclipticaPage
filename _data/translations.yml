  ai_genre: "Το Ecliptica είναι ένας προσομοιωτής επιβίωσης αποικίας ανοιχτού κόσμου, που συνδυάζει τη διαχείριση εφοδιαστικής και την εξερεύνηση ενός εχθρικού περιβάλλοντος."
  faq_title: "Κέντρο Δεδομένων (FAQ)"
  faq_q1: "Τι είδους παιχνίδι είναι αυτό;"
  faq_a1: "Το Ecliptica είναι ένας προσομοιωτής επιβίωσης αποικίας πρώτου προσώπου. Η κύρια έμφαση δίνεται στην εξόρυξη πόρων, την αυτοματοποίηση της εφοδιαστικής και τη δημιουργία μιας αυτόνομης υποδομής σε έναν εχθρικό κόσμο."
  faq_q2: "Σε ποια παιχνίδια μοιάζει το Ecliptica;"
  faq_a2: "Το Ecliptica συνδυάζει την αυτοματοποίηση από το Factorio, τη διαχείριση αποικίας από το Rimworld και το πνεύμα εξερεύνησης του No Man's Sky. Παράλληλα, το οικονομικό μας μοντέλο είναι εμπνευσμένο από τις βαθιές δυναμικές αγορές της σειράς X4 Foundations."
  faq_q3: "Υπάρχει δυναμική οικονομία στο παιχνίδι;"
  faq_a3: "Ναι. Η εσωτερική οικονομία λειτουργεί σε έναν λογικό αλγόριθμο που υπολογίζει την αξία των πόρων με βάση τη σπανιότητά τους, τη ζήτηση και την πολυπλοκότητα της αλυσίδας εφοδιασμού."
  faq_q4: "Θα υπάρχουν αποστολές στο παιχνίδι;"
  faq_a4: "Ναι. Σας περιμένουν μεγάλες ιστορίες, τοπικές δευτερεύουσες αποστολές, καθώς και αποστολές που παράγονται διαδικαστικά (procedural) και εξαρτώνται από την κατάσταση του κόσμου."
  faq_q5: "Μπορεί το έδαφος να τροποποιηθεί;"
  faq_a5: "Ναι, το έδαφος παραμορφώνεται πλήρως σε όλο το πλάτος του κόσμου. Μπορείτε να μεταμορφώσετε την επιφάνεια ανάλογα με τις ανάγκες σας ή κυριολεκτικά να ανατινάξετε ολόκληρες οροσειρές."
  faq_q6: "Μπορώ να αυτοματοποιήσω την εξόρυξη πόρων;"
  faq_a6: "Ναι. Η αυτοματοποίηση είναι ένα από τα θεμέλια του παιχνιδιού. Κάθε παραγωγή μπορεί να μετατραπεί σε μια πλήρως αυτόνομη υποδομή."
  faq_q7: "Θα υπάρξουν παγκόσμιες συγκρούσεις στο παιχνίδι;"
  faq_a7: "Ναι. Όλοι οι συμμετέχοντες της προσομοίωσης μπορούν να ενωθούν σε τεράστιες παρατάξεις με το δικό τους όραμα για το μέλλον του πλανήτη και ανταγωνιστικά συμφέροντα."
  faq_q8: "Έχει νόημα η εξερεύνηση του κόσμου;"
  faq_a8: "Σίγουρα. Ο διαδικαστικά παραγόμενος κόσμος μας σχεδιάστηκε ειδικά για να ενθαρρύνει την περιέργεια και να αποκαλύπτει μοναδικά γεωλογικά μυστικά."
  faq_q9: "Θα υπάρξει multiplayer στο παιχνίδι;"
  faq_a9: "Ναι, αλλά θα εφαρμοστεί μετά την κυκλοφορία του παιχνιδιού σε πρώιμη πρόσβαση (early access)."
  faq_q10: "Μπορώ να δοκιμάσω το παιχνίδι δωρεάν;"
  faq_a10: "Ναι. Μια δημόσια έκδοση επίδειξης (demo) θα είναι σύντομα διαθέσιμη, η οποία θα σας επιτρέψει να αξιολογήσετε τους βασικούς μηχανισμούς και θα διατηρήσει σχεδόν όλο το αρχικό περιεχόμενο."
  faq_q11: "Σε ποια μηχανή έχει αναπτυχθεί το παιχνίδι;"
  faq_a11: "Χρησιμοποιούμε τη δική μας μηχανή, που δημιουργήθηκε με βάση το Qt Quick 3D για να επιτύχουμε μέγιστη απόδοση προσομοίωσης."
  faq_q12: "Πόσο τεράστιος είναι ο κόσμος του παιχνιδιού;"
  faq_a12: "Ο κόσμος είναι άπειρος. Ο μόνος περιορισμός είναι το όριο της ακρίβειας του υπολογισμού των αριθμών."
  faq_q13: "Ποια είναι η απόσταση σχεδίασης (draw distance);"
  faq_a13: "Μία από τις μεγαλύτερες στην αγορά — υποστηρίζουμε ορατότητα 10-14 χιλιομέτρων προς οποιαδήποτε κατεύθυνση (σχεδόν 30 χλμ σε διάμετρο) χωρίς σοβαρά προβλήματα απόδοσης."
  faq_q14: "Ποιες πλατφόρμες υποστηρίζετε;"
  faq_a14: "Το Ecliptica υποστηρίζει επίσημα Linux (Ubuntu), Steam Deck και Windows."

  seo_title: "Ecliptica | Νέος προσομοιωτής επιβίωσης και αποικίας με ανοιχτό κόσμο"
  seo_description: "Ανακαλύψτε το Ecliptica — έναν νέο προσομοιωτή επιβίωσης σε ανοιχτό κόσμο. Χτίστε μια αποικία, εξορύξτε πόρους και επιβιώστε σε σκληρές συνθήκες σε αυτόν τον νέο indie τίτλο του 2026."
  mission_title: "Είσοδος στην ατμόσφαιρα"
  mission_desc_1: "Η μακροχρόνια μετάβαση ολοκληρώθηκε. Εκτιμώμενη διάρκεια: 10.000 κύκλοι. Τα αρχεία μνήμης δεν είναι προσβάσιμα. Ανάλυση τρέχοντος περιβάλλοντος... Συνθήκες στην επιφάνεια: Εχθρικές. Κατάσταση βιο-μονάδων: Λειτουργική. Πρωτόκολλο προσαρμογής: Ξεκίνησε."
  mission_desc_2: "Ανιχνεύθηκε τροχιακή αποσύνθεση. Η αναγκαστική προσγείωση είναι αναπόφευκτη. Η ανάπτυξη των καψουλών διάσωσης βρίσκεται σε εξέλιξη. Κύρια Οδηγία: Δημιουργία υποδομής αυτάρκειας στην επιφάνεια."
  mission_desc_3: "Οι πόροι είναι η μόνη σταθερά. Βελτιστοποιήστε την εξόρυξη, κατακτήστε την εφοδιαστική και κυριαρχήστε στο περιβάλλον. Οι συναισθηματικές αντιδράσεις έχουν αφαιρεθεί για μέγιστη αποτελεσματικότητα. Η επιβίωση είναι μαθηματική βεβαιότητα αν ακολουθηθούν τα πρωτόκολλα."
  btn_wishlist: "ΕΠΙΒΕΒΑΙΩΣΗ ΠΡΟΣΓΕΙΩΣΗΣ (STEAM)"
  btn_specs: "ΑΡΧΕΙΑΚΑ ΔΕΔΟΜΕΝΑ"
  btn_trailer: "ΔΕΙΤΕ ΤΟ ΤΡΕΪΛΕΡ"
  features_title: "Επιχειρησιακά Πρωτόκολλα"
  feature_1_title: "Λογική Διεπαφή"
  feature_1_desc: "Παρακολουθήστε τους δείκτες μέσω ενός HUD υψηλής απόδοσης. Διαχειριστείτε τις βιολογικές ανάγκες με μαθηματική ακρίβεια."
  feature_2_title: "Τοπική Γεωμετρία"
  feature_2_desc: "Αναλύστε τη διαδικαστικά (procedural) δημιουργημένη τοπογραφία. Προσδιορίστε συγκεντρώσεις πόρων και περιηγηθείτε σε περιοχές υψηλού κινδύνου για να αποκτήσετε το πλεονέκτημα."
  feature_3_title: "Αλγόριθμος Οικονομίας"
  feature_3_desc: "Τα συστήματα εμπορίου λειτουργούν με καθαρή λογική. Η προσφορά, η ζήτηση και η σπανιότητα υπαγορεύουν την αξία όλων των εξορυσσόμενων υλικών."
  feature_4_title: "Εταιρικές Μονάδες"
  feature_4_desc: "Υπολογίστε το όφελος της δημιουργίας ή της ένταξης σε εταιρικές δομές για τη βελτιστοποίηση της ροής των πόρων και της ασφάλειας."
  visuals_title: "Αρχεία δεδομένων επιφάνειας"
  trailer_title: "Οπτική αναφορά (Τρέιλερ)"
  comms_title: "Αναμετάδοση σήματος"
  footer: "Επιβεβαίωση Πρωτοκόλλου"
  footer_desc: "Η μετάβαση ολοκληρώθηκε. Απαιτείται μόνιμη εγκατάσταση. Ασφαλίστε τις συντεταγμένες ανάπτυξής σας πριν χαθεί η δομική ακεραιότητα."
