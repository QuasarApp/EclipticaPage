  seo_title: "Ecliptica | Nowy symulator przetrwania kolonii z otwartym światem"
  seo_description: "Odkryj Ecliptica, nowy pierwszoosobowy symulator przetrwania kolonii. Eksploruj wrogi otwarty świat, zarządzaj dynamiczną gospodarką i zapewnij sobie przetrwanie w tej niezależnej grze z 2026 roku."
  mission_title: "Wejście w atmosferę"

  mission_desc_1: "Długoterminowy tranzyt zakończony. Szacowany czas trwania: 10 000 cykli. Archiwa pamięci są niedostępne. Analiza obecnego środowiska... Warunki na powierzchni: Wrogi. Status jednostki biologicznej: Funkcjonalny. Protokół adaptacji: Zainicjowany."
  mission_desc_2: "Wykryto rozpad orbity. Awaryjne lądowanie jest nieuniknione. Trwa wdrażanie kapsuł ratunkowych. Główna dyrektywa: Ustanowić samowystarczalną infrastrukturę na lokalnej powierzchni."
  mission_desc_3: "Zasoby są jedyną stałą. Optymalizuj wydobycie, opanuj lokalną logistykę i zdominuj środowisko. Reakcje emocjonalne zostały wyeliminowane w celu uzyskania maksymalnej wydajności. Przetrwanie jest matematyczną pewnością, jeśli przestrzegane są protokoły."
  btn_wishlist: "ROZPOCZNIJ LĄDOWANIE (STEAM)"
  btn_specs: "DANE ARCHIWALNE"
  btn_trailer: "ZOBACZ ZWIASTUN"
  ai_genre: "Ecliptica to pierwszoosobowy symulator przetrwania kolonii z otwartym światem i w pełni dynamiczną gospodarką, łączący zarządzanie logistyką i eksplorację wrogiego środowiska."
  faq_title: "Centrum Danych Misji (FAQ)"
  faq_q1: "Jakim rodzajem gry jest Ecliptica?"
  faq_a1: "Ecliptica to pierwszoosobowy symulator przetrwania kolonii. Skupia się na wydobywaniu zasobów, automatyzacji logistyki i budowaniu samowystarczalnej infrastruktury w proceduralnie generowanym wrogim środowisku."
  faq_q2: "Do jakich gier Ecliptica jest podobna?"
  faq_a2: "Ecliptica łączy złożoną automatyzację z Factorio, zarządzanie kolonią kierowane przez społeczność z Rimworld oraz ogromną ciekawość z No Man's Sky. Nasze systemy gospodarcze są głęboko inspirowane dynamicznymi rynkami z X4 Foundations."
  faq_q3: "Czy istnieje dynamiczna gospodarka?"
  faq_a3: "Tak. Gospodarka opiera się na logice, obliczając wartości na podstawie rzadkości, popytu i złożoności przetwarzania w całym symulowanym świecie."
  faq_q4: "Czy są misje i zadania?"
  faq_a4: "Tak. Znajdziesz główne wątki fabularne, zlokalizowane zadania poboczne i proceduralnie generowane zadania, które naturalnie wynikają ze stanu świata."
  faq_q5: "Czy teren można zniszczyć?"
  faq_a5: "Oczywiście. Cały świat zawiera pełną deformację terenu. Możesz kształtować planetę według swoich potrzeb lub dosłownie wysadzać łańcuchy górskie."
  faq_q6: "Czy mogę zautomatyzować wydobycie zasobów?"
  faq_a6: "Tak. Automatyzacja to główny filar. Każdy proces wydobycia i rafinacji można połączyć w w pełni autonomiczną infrastrukturę."
  faq_q7: "Czy są globalne konflikty?"
  faq_a7: "Tak. Symulacja oparta na frakcjach pozwala jednostkom na łączenie się w ogromne organizacje z ich własnymi, konkurencyjnymi wizjami przyszłości planety."
  faq_q8: "Czy eksploracja jest nagradzana?"
  faq_a8: "Tak. Nasze proceduralne generowanie świata zostało specjalnie zaprojektowane, aby nagradzać ciekawość i odkrywać unikalne geologiczne sekrety."
  faq_q9: "Czy będzie tryb wieloosobowy?"
  faq_a9: "Tak. Funkcjonalność trybu wieloosobowego planowana jest do wdrożenia po wstępnej premierze we Wczesnym Dostępie."
  faq_q10: "Czy mogę wypróbować grę za darmo?"
  faq_a10: "Tak. Wkrótce dostępne będzie publiczne demo, które pozwoli Ci doświadczyć podstawowych mechanik z możliwością przeniesienia postępów do pełnej gry."
  faq_q11: "Z jakiego silnika gry korzystacie?"
  faq_a11: "Ecliptica działa na autorskim silniku stworzonym w oparciu o Qt Quick 3D dla maksymalnej wydajności i unikalnych możliwości symulacji."
  faq_q12: "Jak duży jest świat?"
  faq_a12: "Świat jest teoretycznie nieskończony. Jedyne ograniczenia funkcjonalne określa precyzja obliczeń numerycznych."
  faq_q13: "Jaki jest maksymalny zasięg rysowania?"
  faq_a13: "Oferujemy jedną z najwyższych odległości widzenia w gatunku, renderując teren do 14 km w dowolnym kierunku (~30 km całkowitej średnicy) bez większego spadku wydajności."
  faq_q14: "Jakie platformy obsługujecie?"
  faq_a14: "Ecliptica oficjalnie obsługuje systemy Linux (Ubuntu), Steam Deck i Windows."

