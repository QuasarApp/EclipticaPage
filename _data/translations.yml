  feature_3_desc: "Гандлёвыя сістэмы працуюць на чыстай логіцы. Попыт, прапанова і дэфіцыт дыктуюць каштоўнасць усіх здабытых матэрыялаў."
  feature_4_title: "Карпаратыўныя юніты"
  feature_4_desc: "Разлічыце выгаду ад стварэння або ўступлення ў карпаратыўныя структуры для аптымізацыі патоку рэсурсаў і бяспекі."
