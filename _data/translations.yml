be:
  header_boot: "[ ПЕРАЗАГРУЗКА СІСТЭМ... МЭТА ДАСЯГНУТА ]"
  nav_about: "Пра гульню"
  nav_features: "Асаблівасці"
  nav_visuals: "Візуал"
  nav_faq: "FAQ"
