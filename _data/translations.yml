sr:
  header_boot: "[ РЕСТАРТОВАЊЕ СИСТЕМА... ЦИЉ ДОСТИГНУТ ]"
  nav_about: "О игри"
  nav_features: "Карактеристике"
  nav_visuals: "Визуал"
  nav_faq: "FAQ"
