  feature_1_desc: "Кантралюйце паказчыкі праз высокаэфектыўны HUD. Кіруйце біялагічнымі патрэбамі з матэматычнай дакладнасцю."
  feature_2_title: "Лакальная геаметрыя"
  feature_2_desc: "Аналізуйце працэдурна генераваную тапаграфію. Вызначайце скапленні рэсурсаў і перамяшчайцеся ў зонах высокай рызыкі для атрымання пераваг."
