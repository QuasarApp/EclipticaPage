hi:
  header_boot: "[ सिस्टम रीबूट प्रगति पर... लक्ष्य प्राप्त ]"
  nav_about: "गेम के बारे में"
  nav_features: "विशेषताएं"
  nav_visuals: "दृश्य"
  nav_faq: "FAQ"
  nav_wishlist_btn: "विशलिस्ट"

  ai_genre: "Ecliptica एक प्रथम-व्यक्ति ओपन-वर्ल्ड कॉलोनी उत्तरजीविता सिम्युलेटर है जो रसद प्रबंधन और शत्रुतापूर्ण वातावरण की खोज को जोड़ता है।"
  faq_title: "डेटा हब (FAQ)"
  faq_q1: "यह किस प्रकार का खेल है?"
  faq_a1: "Ecliptica प्रथम व्यक्ति से एक कॉलोनी अस्तित्व सिम्युलेटर है। मुख्य फोकस संसाधन निष्कर्षण, रसद स्वचालन और एक शत्रुतापूर्ण दुनिया में एक स्वायत्त बुनियादी ढांचे के निर्माण पर है।"
  faq_q2: "Ecliptica किन खेलों के समान है?"
  faq_a2: "Ecliptica, Factorio के स्वचालन, Rimworld के कॉलोनी प्रबंधन और No Man's Sky की अन्वेषण भावना को जोड़ती है। इसके साथ ही हमारा आर्थिक मॉडल X4 Foundations श्रृंखला के गहरे गतिशील बाजारों से प्रेरित है।"
  faq_q3: "क्या गेम में गतिशील अर्थव्यवस्था है?"
  faq_a3: "हाँ। आंतरिक अर्थव्यवस्था एक तार्किक एल्गोरिथ्म पर काम करती है, जो उनकी कमी, मांग और रसद श्रृंखला की जटिलता के आधार पर संसाधनों के मूल्य की गणना करती है।"
  faq_q4: "क्या गेम में खोज (quests) होंगी?"
  faq_a4: "हाँ। आपके लिए बड़ी कहानी शाखाएं, स्थानीय पक्ष कार्य, और साथ ही दुनिया की स्थिति पर निर्भर प्रक्रियात्मक रूप से उत्पन्न मिशन होंगे।"
  faq_q5: "क्या परिदृश्य को बदला जा सकता है?"
  faq_a5: "हाँ, परिदृश्य दुनिया की पूरी चौड़ाई में पूरी तरह से विकृत हो जाता है। आप अपनी आवश्यकताओं के अनुसार सतह को बदल सकते हैं या सचमुच पूरी पर्वत श्रृंखलाओं को उड़ा सकते हैं।"
  faq_q6: "क्या मैं संसाधन निष्कर्षण को स्वचालित कर सकता हूँ?"
  faq_a6: "हाँ। स्वचालन खेल के मुख्य आधारों में से एक है। प्रत्येक उत्पादन को पूरी तरह से स्वायत्त बुनियादी ढांचे में बदला जा सकता है।"
  faq_q7: "क्या खेल में वैश्विक संघर्ष होंगे?"
  faq_a7: "हाँ। सिमुलेशन के सभी प्रतिभागी भविष्य के ग्रह के अपने दृष्टिकोण और प्रतिस्पर्धी हितों के साथ विशाल गुटों में एकजुट हो सकते हैं।"
  faq_q8: "क्या दुनिया की खोज करने का कोई मतलब है?"
  faq_a8: "निश्चित रूप से। हमारी प्रक्रियात्मक रूप से उत्पन्न दुनिया को विशेष रूप से जिज्ञासा को प्रोत्साहित करने और अद्वितीय भूवैज्ञानिक रहस्यों को उजागर करने के लिए डिज़ाइन किया गया था।"
  faq_q9: "क्या गेम में मल्टीप्लेयर होगा?"
  faq_a9: "हाँ, लेकिन इसे गेम के प्रारंभिक पहुँच (early access) में जारी होने के बाद लागू किया जाएगा।"
  faq_q10: "क्या मैं गेम को मुफ्त में आज़मा सकता हूँ?"
  faq_a10: "हाँ। जल्द ही एक सार्वजनिक डेमो संस्करण दिखाई देगा, जो आपको मुख्य यांत्रिकी का मूल्यांकन करने की अनुमति देगा और लगभग सभी मूल सामग्री को बचाएगा।"
  faq_q11: "गेम किस इंजन पर विकसित किया गया है?"
  faq_a11: "सिमुलेशन के अधिकतम प्रदर्शन को प्राप्त करने के लिए हम Qt Quick 3D के आधार पर बनाए गए अपने स्वयं इंजन का उपयोग करते हैं।"
  faq_q12: "खेल की दुनिया कितनी विशाल है?"
  faq_a12: "दुनिया अनंत है। एकमात्र सीमा संख्याओं की गणना की सटीकता की सीमा है।"
  faq_q13: "ड्रॉ दूरी (draw distance) क्या है?"
  faq_a13: "बाजार में सबसे बड़े में से एक — हम बिना किसी गंभीर प्रदर्शन समस्या के किसी भी दिशा में 10-14 किलोमीटर (व्यास में लगभग 30 किमी) की दृश्यता का समर्थन करते हैं।"
  faq_q14: "आप किन प्लेटफार्मों का समर्थन करते हैं?"
  faq_a14: "Ecliptica आधिकारिक तौर पर Linux (Ubuntu), Steam Deck और Windows का समर्थन करता है।"

