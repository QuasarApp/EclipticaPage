  ai_genre: "Ecliptica је симулатор преживљавања колоније отвореног света, који спаја управљање логистиком и истраживање непријатељског окружења."
  faq_title: "Центар података (FAQ)"
  faq_q1: "Шта је ово за игра?"
  faq_a1: "Ecliptica је симулатор преживљавања колоније из првог лица. Главни фокус је на експлоатацији ресурса, аутоматизацији логистике и стварању аутономне инфраструктуре у непријатељском свету."
  faq_q2: "Којим играма је слична Ecliptica?"
  faq_a2: "Ecliptica комбинује аутоматизацију из Factorio-a, управљање колонијом из Rimworld-a и дух истраживања No Man's Sky-a. При томе је наш економски модел инспирисан дубоким динамичним тржиштима серије X4 Foundations."
  faq_q3: "Да ли у игри постоји динамична економија?"
  faq_a3: "Да. Унутрашња економија ради на логичком алгоритму који израчунава вредност ресурса на основу њихове оскудице, потражње и сложености логистичког ланца."
  faq_q4: "Да ли ће у игри бити мисија?"
  faq_a4: "Да. Очекују вас велике приче, локални споредни задаци, као и процедурално генерисане мисије које зависе од стања света."
  faq_q5: "Да ли се пејзаж може мењати?"
  faq_a5: "Да, пејзаж се потпуно деформише по целој ширини света. Можете преобликовати површину према својим потребама или буквално дизати у ваздух целе планинске венце."
  faq_q6: "Да ли могу да аутоматизујем експлоатацију ресурса?"
  faq_a6: "Да. Аутоматизација је један од темеља игре. Свака производња се може претворити у потпуно аутономну инфраструктуру."
  faq_q7: "Да ли ће у игри бити глобалних конфликата?"
  faq_a7: "Да. Сви учесници симулације могу да се уједине у огромне фракције са сопственом визијом будућности планете и конкурентским интересима."
  faq_q8: "Да ли има смисла истраживати свет?"
  faq_a8: "Свакако. Наш процедурално генерисани свет је специјално дизајниран да подстакне радозналост и открије јединствене геолошке тајне."
  faq_q9: "Да ли ће у игри бити мултиплејера?"
  faq_a9: "Да, али ће бити реализован након изласка игре у рани приступ (early access)."
  faq_q10: "Да ли могу бесплатно да пробам игру?"
  faq_a10: "Да. Ускоро ће се појавити јавна демо верзија која ће вам омогућити да процените основне механике и задржаће скоро сав оригинални садржај."
  faq_q11: "На ком енџину је игра развијена?"
  faq_a11: "Користимо сопствени енџин направљен на бази Qt Quick 3D да бисмо постигли максималне перформансе симулације."
  faq_q12: "Колико је огроман свет игре?"
  faq_a12: "Свет је бесконачан. Једино ограничење је граница прецизности рачунања бројева."
  faq_q13: "Колика је даљина исцртавања?"
  faq_a13: "Једна од највећих на тржишту — подржавамо видљивост од 10-14 километара у било ком правцу (скоро 30 км у пречнику) без озбиљних проблема са перформансама."
  faq_q14: "Које платформе подржавате?"
  faq_a14: "Ecliptica званично подржава Linux (Ubuntu), Steam Deck и Windows."

  seo_title: "Ecliptica | Нови симулатор преживљавања и колоније са отвореним светом"
  seo_description: "Откријте Ecliptica — нови симулатор преживљавања у отвореном свету. Гради колонију, сакупљај ресурсе и преживи у суровим условима у овом инди наслову из 2026. године."
  mission_title: "Улазак у атмосферу"
  mission_desc_1: "Дуготрајни транзит је завршен. Процењено трајање: 10.000 циклуса. Архиве памћења нису доступне. Анализа тренутног окружења... Услови на површини: Непријатељски. Статус био-јединица: Функционалан. Протокол адаптације: Покренут."
  mission_desc_2: "Откривено је опадање орбите. Хитно слетање је неизбежно. У току је распоређивање капсула за спасавање. Основна директива: Стварање самоодрживе инфраструктуре на површини."
  mission_desc_3: "Ресурси су једина константа. Оптимизујте експлоатацију, савладајте логистику и доминирајте у окружењу. Емоционалне реакције су уклоњене ради максималне ефикасности. Преживљавање је математичка неминовност уз поштовање протокола."
  btn_wishlist: "ПОТВРДИТИ СЛЕТАЊЕ (STEAM)"
  btn_specs: "АРХИВСКИ ПОДАЦИ"
  btn_trailer: "ГЛЕДАЈ ТРЕЈЛЕР"
  features_title: "Оперативни протоколи"
  feature_1_title: "Логички интерфејс"
  feature_1_desc: "Контролишите показатеље кроз високо ефикасни HUD. Управљајте биолошким потребама са математичком прецизношћу."
  feature_2_title: "Локална геометрија"
  feature_2_desc: "Анализирајте процедурално генерисану топографију. Одредите скупине ресурса и крећите се у зонама високог ризика ради стицања предности."
  feature_3_title: "Алгоритам економије"
  feature_3_desc: "Трговачки системи раде на чистој логици. Понуда, потражња и дефицит диктирају вредност свих ископаних материјала."
  feature_4_title: "Корпоративне јединице"
  feature_4_desc: "Израчунајте корист од стварања или придруживања корпоративним структурама ради оптимизације протока ресурса и безбедности."
  visuals_title: "Евиденција података са површине"
  trailer_title: "Визуелни извештај (Трејлер)"
  comms_title: "Пренос сигнала"
  footer: "Потврди протокол"
  footer_desc: "Транзит је завршен. Потребно је трајно насеље. Осигурајте координате за распоређивање пре губитка структуралног интегритета."

it:
  header_boot: "[ RIAVVIO SISTEMA IN CORSO... BERSAGLIO RAGGIUNTO ]"
  nav_about: "Info"
